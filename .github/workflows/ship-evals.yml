name: ship-evals
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-pr26:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: Reproduce PR 26 and base with full response diagnostics
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run python diagnose_pr26.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr26-eval-diagnostics
          path: evals/pr26-diagnostics.json
