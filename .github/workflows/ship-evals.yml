name: ship-evals

on:
  pull_request:
    paths:
      - "plugins/ship/**"
      - "evals/**"
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-evals-${{ github.ref }}
  cancel-in-progress: true

env:
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

jobs:
  evals-pr:
    # Blocking check: agent-level + orchestrator decision-point tiers.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - name: Require eval API keys
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY / OPENAI_API_KEY missing - eval job cannot run. Configure repo Actions secrets (fork PRs do not receive secrets)." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: Unit tests (no model)
        run: uv run pytest tests -v
      - name: Agent + orchestrator evals (blocking)
        run: uv run deepeval test run agents orchestrator -v

  evals-codex:
    # Blocking check for the Codex dispatch dialect only. Separate job so a failure here is
    # visibly Codex-only and never masks the Claude-tier result above.
    if: github.event_name == 'pull_request'
    name: ${{ matrix.check }}
    continue-on-error: ${{ matrix.comparison }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: evals-codex
            api: responses
            model: gpt-6-astra
            effort: medium
            comparison: false
          - check: evals-codex-gpt41-comparison
            api: chat
            model: gpt-4.1
            effort: ''
            comparison: true
    env:
      EVAL_CODEX_API: ${{ matrix.api }}
      EVAL_CODEX_MODEL: ${{ matrix.model }}
      EVAL_CODEX_REASONING_EFFORT: ${{ matrix.effort }}
      EVAL_CODEX_TRACE_DIR: codex-traces
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - name: Codex role files match the agent definitions
        run: |
          python3 ../plugins/ship/scripts/sync_codex_agents.py --check
          python3 ../plugins/ship/scripts/sync_codex_skills.py --check
      - name: Require OpenAI key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY missing - Codex eval job cannot run." >&2
            exit 1
          fi
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: Verify selected model API access
        run: |
          uv run python - <<'PYTHON'
          from ship_evals.codex_harness import CODEX_MODEL, CODEX_EFFORT, call_codex_model
          print(f"Checking API access: {CODEX_MODEL}, reasoning effort: {CODEX_EFFORT}")
          from ship_evals.codex_tools import WAIT_AGENT
          call_codex_model("Reply OK.", [{"role": "user", "content": "OK?"}], [WAIT_AGENT])
          PYTHON
      - name: Codex live scenarios (three independent runs)
        shell: bash
        run: |
          result=0
          echo "Model: $EVAL_CODEX_MODEL; effort: $EVAL_CODEX_REASONING_EFFORT" >> "$GITHUB_STEP_SUMMARY"
          for repetition in 1 2 3; do
            if uv run pytest orchestrator_codex -m codex -v --junitxml="codex-run-$repetition.xml"; then
              echo "Run $repetition: passed" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Run $repetition: failed (see test output and traces)" >> "$GITHUB_STEP_SUMMARY"
              result=1
            fi
          done
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codex-evals-${{ matrix.check }}
          path: |
            evals/codex-traces/
            evals/codex-run-*.xml

  evals-e2e:
    # Nightly / manual: multi-turn pipeline scenarios. Never a required check.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evals
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --frozen
      - name: E2E pipeline scenarios
        run: uv run pytest e2e -m "e2e" -v --junitxml=e2e-report.xml
      - name: Job summary
        if: always()
        run: |
          echo "## ship E2E eval run" >> "$GITHUB_STEP_SUMMARY"
          uv run python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET
          root = ET.parse("e2e-report.xml").getroot()
          found = root.find("testsuite")
          s = found if found is not None else root
          print(f"- tests: {s.get('tests')}, failures: {s.get('failures')}, errors: {s.get('errors')}, time: {s.get('time')}s")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report
          path: evals/e2e-report.xml
